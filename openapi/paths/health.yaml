health:
  get:
    tags: [health]
    summary: 健康检查
    description: |
      返回服务状态与依赖连通性，用于容器探针与运维大盘。
      不需要认证，失败时返回 503。
    operationId: getHealth
    security: []
    responses:
      '200':
        description: 服务正常
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/ApiEnvelope'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/HealthStatus'
      '503':
        $ref: '../components/responses.yaml#/ServiceUnavailable'
