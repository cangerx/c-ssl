openapi: 3.0.3

info:
  title: c-ssl API
  version: 0.1.0
  description: |
    SSL 证书签发与销售平台接口契约。

    **本文件是所有接口的唯一真源。** 修改接口必须先改本文件：
    Go 服务按此实现，TypeScript 类型由此生成（`make gen`）。
    前后端字段不得各自定义，任何字段变更都以本文件为准。

    统一响应格式：

    ```json
    { "code": 0, "message": "success", "data": {} }
    ```

    `code` 为 0 表示成功，非 0 为业务错误码，具体含义见 `components/schemas/common.yaml`。
  contact:
    name: c-ssl
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: 本地开发
  - url: https://api.c-ssl.example
    description: 生产（占位，Phase 5 替换）

tags:
  - name: health
    description: 健康检查与依赖状态
  - name: auth
    description: 注册、登录与令牌刷新
  - name: me
    description: 当前登录用户
  - name: wallet
    description: 钱包余额与账本流水
  - name: products
    description: 产品目录与可用规则
  - name: orders
    description: 证书订单、域名验证与证书下载
  - name: webhooks
    description: 上游事件回调（调用方是上游服务器，不套用户鉴权）

security:
  - bearerAuth: []

paths:
  /health:
    $ref: './paths/health.yaml#/health'

  /auth/register:
    $ref: './paths/auth.yaml#/register'

  /auth/login:
    $ref: './paths/auth.yaml#/login'

  /auth/refresh:
    $ref: './paths/auth.yaml#/refresh'

  /auth/logout:
    $ref: './paths/auth.yaml#/logout'

  /me:
    $ref: './paths/me.yaml#/me'

  /wallet:
    $ref: './paths/wallet.yaml#/wallet'

  /wallet/ledger:
    $ref: './paths/wallet.yaml#/ledger'

  /recharge/orders:
    $ref: './paths/recharge.yaml#/orders'

  /payments/webhook/{channel}:
    $ref: './paths/payments.yaml#/webhook'

  /payments/mock/notify:
    $ref: './paths/payments.yaml#/mockNotify'

  /products:
    $ref: './paths/products.yaml#/list'

  /products/{id}:
    $ref: './paths/products.yaml#/detail'

  /orders:
    $ref: './paths/orders.yaml#/orders'

  /orders/{orderNo}:
    $ref: './paths/orders.yaml#/orderDetail'

  /orders/{orderNo}/cancel:
    $ref: './paths/orders.yaml#/cancelOrder'

  /orders/{orderNo}/reissue:
    $ref: './paths/orders.yaml#/reissueOrder'

  /orders/{orderNo}/domains:
    $ref: './paths/orders.yaml#/orderDomains'

  /orders/{orderNo}/domains/verify:
    $ref: './paths/orders.yaml#/verifyDomains'

  /orders/{orderNo}/domains/resend-email:
    $ref: './paths/orders.yaml#/resendDcvEmail'

  /orders/{orderNo}/domains/regenerate-token:
    $ref: './paths/orders.yaml#/regenerateDcvToken'

  /orders/{orderNo}/certificate:
    $ref: './paths/orders.yaml#/downloadCertificate'

  /webhooks/foxssl:
    $ref: './paths/webhooks.yaml#/foxssl'

components:
  securitySchemes:
    bearerAuth:
      $ref: './components/security.yaml#/bearerAuth'

  parameters:
    ProductId:
      $ref: './components/parameters.yaml#/ProductId'

    OrderNo:
      $ref: './components/parameters.yaml#/OrderNo'

  schemas:
    ErrorResponse:
      $ref: './components/schemas/common.yaml#/ErrorResponse'

    HealthStatus:
      $ref: './components/schemas/common.yaml#/HealthStatus'

    User:
      $ref: './components/schemas/user.yaml#/User'

    RegisterRequest:
      $ref: './components/schemas/user.yaml#/RegisterRequest'

    LoginRequest:
      $ref: './components/schemas/user.yaml#/LoginRequest'

    RefreshRequest:
      $ref: './components/schemas/user.yaml#/RefreshRequest'

    AuthTokens:
      $ref: './components/schemas/user.yaml#/AuthTokens'

    MeResponse:
      $ref: './components/schemas/user.yaml#/MeResponse'

    AuthTokensResponse:
      $ref: './components/schemas/user.yaml#/AuthTokensResponse'

    WalletAccount:
      $ref: './components/schemas/wallet.yaml#/WalletAccount'

    WalletLedgerEntry:
      $ref: './components/schemas/wallet.yaml#/WalletLedgerEntry'

    WalletAccountResponse:
      $ref: './components/schemas/wallet.yaml#/WalletAccountResponse'

    WalletLedgerResponse:
      $ref: './components/schemas/wallet.yaml#/WalletLedgerResponse'

    Product:
      $ref: './components/schemas/product.yaml#/Product'

    ProductPrice:
      $ref: './components/schemas/product.yaml#/ProductPrice'

    DcvMethod:
      $ref: './components/schemas/product.yaml#/DcvMethod'

    ProductListResponse:
      $ref: './components/schemas/product.yaml#/ProductListResponse'

    ProductDetailResponse:
      $ref: './components/schemas/product.yaml#/ProductDetailResponse'

    OrderStatus:
      $ref: './components/schemas/order.yaml#/OrderStatus'

    OrderContact:
      $ref: './components/schemas/order.yaml#/OrderContact'

    OrderOrganization:
      $ref: './components/schemas/order.yaml#/OrderOrganization'

    CreateOrderRequest:
      $ref: './components/schemas/order.yaml#/CreateOrderRequest'

    CertificateOrderSummary:
      $ref: './components/schemas/order.yaml#/CertificateOrderSummary'

    CertificateOrder:
      $ref: './components/schemas/order.yaml#/CertificateOrder'

    CreateOrderResponse:
      $ref: './components/schemas/order.yaml#/CreateOrderResponse'

    OrderListResponse:
      $ref: './components/schemas/order.yaml#/OrderListResponse'

    OrderDetailResponse:
      $ref: './components/schemas/order.yaml#/OrderDetailResponse'

    DomainStatus:
      $ref: './components/schemas/dcv.yaml#/DomainStatus'

    OrderDomain:
      $ref: './components/schemas/dcv.yaml#/OrderDomain'

    DomainListResponse:
      $ref: './components/schemas/dcv.yaml#/DomainListResponse'

    VerifyDomainsRequest:
      $ref: './components/schemas/dcv.yaml#/VerifyDomainsRequest'

    ResendEmailRequest:
      $ref: './components/schemas/dcv.yaml#/ResendEmailRequest'

    RegenerateTokenResponse:
      $ref: './components/schemas/dcv.yaml#/RegenerateTokenResponse'

    Certificate:
      $ref: './components/schemas/certificate.yaml#/Certificate'

    CertificateResponse:
      $ref: './components/schemas/certificate.yaml#/CertificateResponse'

    FoxsslWebhookPayload:
      $ref: './components/schemas/webhook.yaml#/FoxsslWebhookPayload'

    WebhookAck:
      $ref: './components/schemas/webhook.yaml#/WebhookAck'

  responses:
    BadRequest:
      $ref: './components/responses.yaml#/BadRequest'
    Unauthorized:
      $ref: './components/responses.yaml#/Unauthorized'
    Forbidden:
      $ref: './components/responses.yaml#/Forbidden'
    NotFound:
      $ref: './components/responses.yaml#/NotFound'
    TooManyRequests:
      $ref: './components/responses.yaml#/TooManyRequests'
    InternalError:
      $ref: './components/responses.yaml#/InternalError'
    ServiceUnavailable:
      $ref: './components/responses.yaml#/ServiceUnavailable'
    BadGateway:
      $ref: './components/responses.yaml#/BadGateway'
