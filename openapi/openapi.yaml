openapi: 3.0.3

info:
  title: c-ssl API
  version: 0.1.0
  description: |
    SSL 证书签发与销售平台接口契约。

    **本文件是所有接口的唯一真源。** 修改接口必须先改本文件：
    Go 服务按此实现，TypeScript 类型由此生成（`make gen`）。
    前后端字段不得各自定义，任何字段变更都以本文件为准。

    统一响应格式：

    ```json
    { "code": 0, "message": "success", "data": {} }
    ```

    `code` 为 0 表示成功，非 0 为业务错误码，具体含义见 `components/schemas/common.yaml`。
  contact:
    name: c-ssl
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: 本地开发
  - url: https://api.c-ssl.example
    description: 生产（占位，Phase 5 替换）

tags:
  - name: health
    description: 健康检查与依赖状态
  - name: auth
    description: 注册、登录与令牌刷新
  - name: me
    description: 当前登录用户
  - name: products
    description: 产品目录与可用规则

security:
  - bearerAuth: []

paths:
  /health:
    $ref: './paths/health.yaml#/health'

  /auth/register:
    $ref: './paths/auth.yaml#/register'

  /auth/login:
    $ref: './paths/auth.yaml#/login'

  /auth/refresh:
    $ref: './paths/auth.yaml#/refresh'

  /me:
    $ref: './paths/me.yaml#/me'

  /products:
    $ref: './paths/products.yaml#/list'

  /products/{id}:
    $ref: './paths/products.yaml#/detail'

components:
  securitySchemes:
    bearerAuth:
      $ref: './components/security.yaml#/bearerAuth'

  parameters:
    ProductId:
      $ref: './components/parameters.yaml#/ProductId'

  schemas:
    ErrorResponse:
      $ref: './components/schemas/common.yaml#/ErrorResponse'

    HealthStatus:
      $ref: './components/schemas/common.yaml#/HealthStatus'

    User:
      $ref: './components/schemas/user.yaml#/User'

    RegisterRequest:
      $ref: './components/schemas/user.yaml#/RegisterRequest'

    LoginRequest:
      $ref: './components/schemas/user.yaml#/LoginRequest'

    RefreshRequest:
      $ref: './components/schemas/user.yaml#/RefreshRequest'

    AuthTokens:
      $ref: './components/schemas/user.yaml#/AuthTokens'

    MeResponse:
      $ref: './components/schemas/user.yaml#/MeResponse'

    AuthTokensResponse:
      $ref: './components/schemas/user.yaml#/AuthTokensResponse'

    Product:
      $ref: './components/schemas/product.yaml#/Product'

    ProductPrice:
      $ref: './components/schemas/product.yaml#/ProductPrice'

    DcvMethod:
      $ref: './components/schemas/product.yaml#/DcvMethod'

    ProductListResponse:
      $ref: './components/schemas/product.yaml#/ProductListResponse'

    ProductDetailResponse:
      $ref: './components/schemas/product.yaml#/ProductDetailResponse'

  responses:
    BadRequest:
      $ref: './components/responses.yaml#/BadRequest'
    Unauthorized:
      $ref: './components/responses.yaml#/Unauthorized'
    Forbidden:
      $ref: './components/responses.yaml#/Forbidden'
    NotFound:
      $ref: './components/responses.yaml#/NotFound'
    TooManyRequests:
      $ref: './components/responses.yaml#/TooManyRequests'
    InternalError:
      $ref: './components/responses.yaml#/InternalError'
    ServiceUnavailable:
      $ref: './components/responses.yaml#/ServiceUnavailable'
