OrderStatus:
  type: string
  description: |
    证书订单状态。正常路径：

    ```text
    pending_payment → submitting → waiting_dcv → issuing → issued
    ```

    几条不显然的约束：

    - `issued`、`cancelled`、`failed` 是终态，不可回退。重签产生新的订单记录，
      而不是把已签发的订单改回去。
    - 不存在 `pending_payment → issued` 这种跨越：签发必须经过域名验证，
      否则等于绕过 DCV 给任意域名发证。
    - `paid` 是给「先下单、后支付」模式预留的状态。当前流程是钱包即时扣款，
      冻结即代表用户已承诺付款，因此不经过 `paid`。
  enum:
    - pending_payment
    - paid
    - submitting
    - waiting_dcv
    - issuing
    - issued
    - cancelled
    - failed

KeyAlgorithm:
  $ref: './product.yaml#/KeyAlgorithm'

OrderContact:
  type: object
  description: 证书联系人。CA 在 OV/EV 审核时会联系此人，请填真实可触达的信息。
  required: [name, email, phone]
  properties:
    name:
      type: string
      maxLength: 64
      example: 张三
    email:
      type: string
      format: email
      maxLength: 128
      example: admin@example.com
    phone:
      type: string
      maxLength: 32
      description: 含国家码，例如 +86.13800138000
      example: +86.13800138000
    title:
      type: string
      maxLength: 64
      nullable: true
      description: 职位，OV/EV 建议填写

OrderOrganization:
  type: object
  description: |
    企业主体信息。`requireOrganizationInfo` 为 true 的产品（OV、EV）必须提交，
    且各字段会由 CA 人工核验，填错会导致审核驳回。
  required: [name, registrationNo, country, province, city, address, postalCode, phone]
  properties:
    name:
      type: string
      maxLength: 128
      description: 企业注册全称，须与营业执照完全一致
      example: 某某科技有限公司
    registrationNo:
      type: string
      maxLength: 64
      description: 统一社会信用代码或当地等效的注册号
      example: 91310000MA1K35XXXX
    country:
      type: string
      maxLength: 2
      description: ISO 3166-1 两位国家代码
      example: CN
    province:
      type: string
      maxLength: 64
      example: 上海市
    city:
      type: string
      maxLength: 64
      example: 上海市
    address:
      type: string
      maxLength: 255
      example: 浦东新区某某路 1 号
    postalCode:
      type: string
      maxLength: 16
      example: "200120"
    phone:
      type: string
      maxLength: 32
      example: +86.02150000000

CreateOrderRequest:
  type: object
  required: [productId, years, keyAlgorithm, domains, contact]
  properties:
    productId:
      type: integer
      format: int64
      description: 产品 ID，取自 `GET /products`
      example: 1
    years:
      type: integer
      description: 购买年限，必须落在产品的 `years` 内
      example: 1
    keyAlgorithm:
      type: string
      description: 密钥算法，必须落在产品的 `keyAlgorithms` 内
      enum: [rsa, ecc]
    domains:
      type: array
      minItems: 1
      maxItems: 100
      description: |
        要签发的域名，第一个是主域名（CN），其余作为 SAN。

        通配符写 `*.example.com`。是否允许通配符、允许多少个域名，
        由产品能力决定，越界会在下单时被拒绝。
      items:
        type: string
        maxLength: 253
      example:
        - example.com
        - www.example.com
    csr:
      type: string
      maxLength: 8192
      nullable: true
      description: |
        证书签名请求（PEM 文本），可省略。

        **强烈建议由客户端生成。** 生成 CSR 的同时会产生私钥，私钥一旦上传到平台
        就等于把证书的控制权交给了平台——平台被入侵、或运维人员误操作，
        都能用这把私钥解密流量。客户端生成则私钥始终不出本地。

        省略时平台代为生成，此时平台持有私钥，会显著降低证书的安全价值，
        仅在对接自动化流程时才应这样做。
    contact:
      $ref: '#/OrderContact'
    organization:
      allOf:
        - $ref: '#/OrderOrganization'
      nullable: true
      description: 企业信息。`requireOrganizationInfo` 为 true 时必须提交

CertificateOrderSummary:
  type: object
  description: |-
    订单列表项。刻意不含联系人、企业信息与 CSR——列表页用不到，
    且这些字段含个人信息，无谓地扩大暴露面。
  required: [orderNo, productId, productName, brand, validationType, years, keyAlgorithm, domains, amount, status, createdAt]
  properties:
    orderNo:
      type: string
      description: 平台订单号，形如 CS20260917120000A7K3M9
      example: CS20260917120000A7K3M9
    productId:
      type: integer
      format: int64
    productName:
      type: string
      example: DigiCert Secure Site OV
    brand:
      type: string
      example: DigiCert
    validationType:
      type: string
      enum: [dv, ov, ev]
    years:
      type: integer
      example: 1
    keyAlgorithm:
      type: string
      enum: [rsa, ecc]
    domains:
      type: array
      description: 订单包含的域名，第一个是主域名
      items:
        type: string
    amount:
      type: integer
      format: int64
      description: 订单金额（分）。等于下单时冻结、随后实扣的金额
      example: 29800
    status:
      $ref: '#/OrderStatus'
    certId:
      type: string
      nullable: true
      description: 上游证书编号，签发后才有
    failureReason:
      type: string
      nullable: true
      description: 失败原因，仅 `failed` 状态有值
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CertificateOrder:
  allOf:
    - $ref: '#/CertificateOrderSummary'
    - type: object
      description: 订单详情，在列表项基础上补充联系人、企业信息与上游编号
      properties:
        upstreamOrderNo:
          type: string
          nullable: true
          description: |
            FoxSSL 订单号。客服排查与对账时需要，因此对用户可见。

            注意上游还有一组原始状态字段（上游订单状态、证书状态、准备状态、
            重签状态），它们只出现在运营后台：这些取值的含义随上游版本变化，
            直接暴露给用户会引起误判。
        contact:
          $ref: '#/OrderContact'
        organization:
          allOf:
            - $ref: '#/OrderOrganization'
          nullable: true
        issuedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: 证书到期时间，签发后才有

CreateOrderResponse:
  allOf:
    - $ref: './common.yaml#/ApiEnvelope'
    - type: object
      required: [data]
      properties:
        data:
          $ref: '#/CertificateOrder'

OrderListResponse:
  allOf:
    - $ref: './common.yaml#/ApiEnvelope'
    - type: object
      required: [data]
      properties:
        data:
          type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/CertificateOrderSummary'
            nextCursor:
              type: integer
              format: int64
              nullable: true
              description: 下一页游标，为 null 表示已到末页

OrderDetailResponse:
  allOf:
    - $ref: './common.yaml#/ApiEnvelope'
    - type: object
      required: [data]
      properties:
        data:
          $ref: '#/CertificateOrder'
