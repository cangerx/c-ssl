name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.26"
  # 与本地 `golangci-lint --version` 对齐，避免 CI 与本地结论不一致。
  # 注意：golangci-lint 2.x 必须配 golangci-lint-action v7 及以上。
  GOLANGCI_LINT_VERSION: "v2.13.2"

jobs:
  contract:
    name: 契约校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 先装 pnpm 再装 node，这样 setup-node 才能缓存 pnpm store。
      # 不要给 action 传 version：版本由 package.json 的 packageManager 决定，
      # 两处同时指定会报 ERR_PNPM_BAD_PM_VERSION。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 创建工具环境
        run: make tooling-setup

      - name: 校验 OpenAPI 契约
        run: make spec-check

      - name: 校验生成物未漂移
        run: make gen-check

      - name: 前端类型检查
        run: make typecheck

  server:
    name: 服务端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: 编译
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt 格式校验
        # 本 job 默认工作目录是 server/，而 Makefile 在仓库根目录
        working-directory: .
        run: make fmt-check

      - name: 单元测试
        run: go test ./... -race -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server
