name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.26"
  # 与本地 `golangci-lint --version` 对齐，避免 CI 与本地结论不一致。
  # 注意：golangci-lint 2.x 必须配 golangci-lint-action v7 及以上。
  GOLANGCI_LINT_VERSION: "v2.13.2"
  # 与 docs/本地开发环境.md 记录的版本对齐
  GOLANG_MIGRATE_VERSION: "v4.20.1"
  # 端口取自 docker-compose.yml 的映射（刻意避开 3306，防止与本机实例冲突）。
  # 密码是容器内的默认值，仅用于 CI 的一次性容器。
  CI_MYSQL_TEST_DSN: "root:root@tcp(127.0.0.1:3307)/c_ssl_test?charset=utf8mb4&parseTime=true&loc=Local"

jobs:
  contract:
    name: 契约校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 先装 pnpm 再装 node，这样 setup-node 才能缓存 pnpm store。
      # 不要给 action 传 version：版本由 package.json 的 packageManager 决定，
      # 两处同时指定会报 ERR_PNPM_BAD_PM_VERSION。
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 创建工具环境
        run: make tooling-setup

      - name: 校验 OpenAPI 契约
        run: make spec-check

      - name: 校验生成物未漂移
        run: make gen-check

      - name: 前端类型检查
        run: make typecheck

  server:
    name: 服务端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: 启动依赖服务（MySQL / Redis）
        # 用仓库里的 compose 定义，而不是 GitHub 的 services 块：
        # 这样本地想复现 CI 环境是同一条命令，定义也不会因为没人用而腐坏。
        # --wait 会等到 healthcheck 通过才返回。
        working-directory: .
        run: docker compose up -d --wait

      - name: 安装 golang-migrate
        # 测试库需要先迁移，所以这里必须有 migrate 二进制。
        # 版本与 docs/本地开发环境.md 记录的一致，避免 CI 与本地行为分叉。
        run: go install -tags mysql github.com/golang-migrate/migrate/v4/cmd/migrate@${{ env.GOLANG_MIGRATE_VERSION }}

      - name: 编译
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: gofmt 格式校验
        # 本 job 默认工作目录是 server/，而 Makefile 在仓库根目录
        working-directory: .
        run: make fmt-check

      - name: 单元测试
        # 用 test-db 而不是 test：它会先把测试库迁移到最新版本，
        # 保证需要数据库的用例真的执行，而不是因为表不存在而失败、
        # 或者因为连不上库而静默跳过。
        working-directory: .
        run: make test-db
        env:
          MYSQL_TEST_DSN: ${{ env.CI_MYSQL_TEST_DSN }}

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: server
